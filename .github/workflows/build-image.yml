# Add to your fork at: .github/workflows/build-image.yml
  # Then: Actions tab -> "Build self-host image" -> Run workflow
  name: Build self-host image

  on:
    workflow_dispatch:
      inputs:
        webapp_url:
          description: "Public URL baked into the build (can still be overridden at runtime)"
          default: "https://book.devscape.io"
          required: true

  permissions:
    contents: read
    packages: write

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 120
      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: build
            POSTGRES_PASSWORD: build
            POSTGRES_DB: calendso
          ports: ["5432:5432"]
          options: >-
            --health-cmd "pg_isready -U build" --health-interval 5s --health-retries 20
      steps:
        - name: Free disk space
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            docker system prune -af || true
            df -h /

        - uses: actions/checkout@v4

        - uses: docker/setup-buildx-action@v3
          with:
            driver-opts: network=host

        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository_owner }}/cal.diy
            tags: |
              type=raw,value=latest
              type=sha,format=short

        - uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64
            network: host
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
            build-args: |
              NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }}
              NEXT_PUBLIC_LICENSE_CONSENT=agree
              CALCOM_TELEMETRY_DISABLED=1
              DATABASE_URL=postgresql://build:build@localhost:5432/calendso
              DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/calendso
